services:
  pocket-notes:
    image: ghcr.io/abjelosevic88/pocket-homelab-notes:latest
    container_name: pocket-notes
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # STORAGE_ROOTS: /notes           # folders people may keep their notes in (mount them below)
      # NOTIFY_URL: http://apprise:8000/notify/notes   # when a notes folder stops answering
      # CORE_URL: http://pocket-core:8080              # Pocket Core: sign-in, integrations, events
      # CORE_REGISTRATION_KEY: …
      # DEMO_DATA: "true"               # seed a few made-up notes into an empty box
    volumes:
      - ./data:/data                    # database (index, history, trash) and the built-in notes folder
      # - /mnt/nas/notes:/notes         # a folder offered through STORAGE_ROOTS
